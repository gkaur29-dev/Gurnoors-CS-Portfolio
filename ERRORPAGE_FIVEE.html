<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Using your Sage/Pewter theme colors */
            background: linear-gradient(135deg, #E6EBE0, #A5B4A8);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Floating Emoji Background */
        .emoji {
            position: absolute;
            font-size: 2.5rem;
            user-select: none;
            z-index: 1;
            animation: float 5s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-25px) scale(1.1); }
        }

        /* The Pop-up Card */
        .card {
            background: white;
            padding: 3rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(58, 64, 58, 0.1);
            text-align: center;
            z-index: 10;
            max-width: 450px;
            border: 6px solid #fff;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #82998A; /* Sage Green */
            margin-bottom: 15px;
            font-size: 2rem;
            letter-spacing: -1px;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #A5B4A8;
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 15px;
            font-weight: bold;
            transition: all 0.3s;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(165, 180, 168, 0.4);
        }

        .btn:hover {
            background-color: #82998A;
            box-shadow: 0 6px 20px rgba(130, 153, 138, 0.5);
            transform: scale(1.02);
        }

        .heart {
            color: #F0DADA; /* Your Pink accent color */
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="emoji" style="top: 10%; left: 15%; animation-delay: 0s;">💻</div>
    <div class="emoji" style="top: 65%; left: 10%; animation-delay: 1.2s;">🎨</div>
    <div class="emoji" style="top: 20%; right: 15%; animation-delay: 0.5s;">🚀</div>
    <div class="emoji" style="bottom: 15%; right: 20%; animation-delay: 2s;">⚙️</div>
    <div class="emoji" style="top: 45%; left: 48%; animation-delay: 0.8s;">🌱</div>

    <div class="card">
        <h1>Under Construction <span class="heart">✦</span></h1>
        <p>I'm currently coding something awesome for this section. Check back soon to see the latest update!</p>
        <a href="index.html" class="btn">Return to Portfolio</a>
    </div>

</body>
</html>
