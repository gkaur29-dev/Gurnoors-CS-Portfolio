<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Quest: Centurion</title>
    <style>
        :root {
            --bg-deep: #050208;
            --panel-bg: #120a1d;
            --accent-glow: #8a2be2;
            --text-main: #f3e5f5;
            --ui-border: #311b92;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at center, #1a0b2e 0%, #050208 100%);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent body scroll */
        }

        .game-container {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--ui-border);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            text-align: center;
            width: 95%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            gap: 10px;
        }

        .control-group { display: flex; flex-direction: column; gap: 5px; font-size: 0.8rem; }

        input[type="number"], input[type="range"] {
            background: #251a36;
            color: white;
            border: 1px solid var(--ui-border);
            padding: 5px;
            border-radius: 4px;
        }

        #hex-display {
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid var(--accent-glow);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Scrollable Area for many circles */
        #scroll-area {
            flex-grow: 1;
            overflow-y: auto;
            margin: 20px 0;
            padding: 10px;
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
        }

        #circles-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 12px;
            justify-items: center;
        }

        .circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, opacity 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .circle:hover { transform: scale(1.2); border-color: white; z-index: 10; }

        #feedback { font-weight: bold; margin-bottom: 15px; min-height: 20px; }

        .btn-reset {
            background: var(--ui-border);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-reset:hover { background: var(--accent-glow); }
        
        /* Custom Scrollbar for the Purple Theme */
        #scroll-area::-webkit-scrollbar { width: 8px; }
        #scroll-area::-webkit-scrollbar-track { background: var(--bg-deep); }
        #scroll-area::-webkit-scrollbar-thumb { background: var(--ui-border); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="controls">
            <div class="control-group">
                <label>Total Circles (Up to 100)</label>
                <input type="number" id="option-count" value="12" min="2" max="100" onchange="setupGame()">
            </div>
            <div class="control-group">
                <label>Difficulty (Similarity)</label>
                <input type="range" id="difficulty" min="0" max="100" value="40" onchange="setupGame()">
            </div>
        </div>

        <div id="hex-display">#FFFFFF</div>

        <div id="scroll-area">
            <div id="circles-container"></div>
        </div>

        <div id="feedback"></div>
        <button class="btn-reset" onclick="setupGame()">New Game</button>
    </div>

    <script>
        let winningHex = "";
        let attemptsLeft = 0;

        function generateRandomHex() {
            return "#" + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase();
        }

        function generateVariantColor(hex, similarity) {
            if (similarity < 5) return generateRandomHex();
            const range = Math.max(2, 220 - (similarity * 2.1));
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const shift = () => Math.floor((Math.random() - 0.5) * range);
            const clamp = (val) => Math.min(255, Math.max(0, val));
            return "#" + [clamp(r + shift()), clamp(g + shift()), clamp(b + shift())]
                .map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        function setupGame() {
            const container = document.getElementById('circles-container');
            const feedback = document.getElementById('feedback');
            let count = parseInt(document.getElementById('option-count').value);
            
            // Guardrail for 100 limit
            if (count > 100) { count = 100; document.getElementById('option-count').value = 100; }
            if (count < 2) { count = 2; document.getElementById('option-count').value = 2; }

            const similarity = parseInt(document.getElementById('difficulty').value);
            
            container.innerHTML = "";
            
            // Dynamically scale chances: more circles = more chances
            attemptsLeft = Math.max(2, Math.floor(count / 10) + 1);
            feedback.textContent = `CHANCES: ${attemptsLeft}`;
            feedback.style.color = "var(--text-main)";

            winningHex = generateRandomHex();
            document.getElementById('hex-display').textContent = winningHex;

            const winnerIndex = Math.floor(Math.random() * count);

            for (let i = 0; i < count; i++) {
                const color = (i === winnerIndex) ? winningHex : generateVariantColor(winningHex, similarity);
                const circle = document.createElement('div');
                circle.className = 'circle';
                circle.style.backgroundColor = color;
                
                circle.onclick = function() {
                    if (color === winningHex) {
                        feedback.textContent = "YOU FOUND IT!";
                        feedback.style.color = "#00ff88";
                        endGame(true);
                    } else {
                        attemptsLeft--;
                        if (attemptsLeft > 0) {
                            feedback.textContent = `WRONG! ${attemptsLeft} CHANCES LEFT`;
                            feedback.style.color = "#ffcc00";
                            this.style.opacity = "0.1";
                            this.style.pointerEvents = "none";
                        } else {
                            feedback.textContent = `GAME OVER - IT WAS THE HIGHLIGHTED ONE`;
                            feedback.style.color = "#ff4b2b";
                            endGame(false);
                        }
                    }
                };
                container.appendChild(circle);
            }
        }

        function endGame(won) {
            const circles = document.querySelectorAll('.circle');
            circles.forEach(c => {
                c.style.pointerEvents = "none";
                // Show the winner clearly on game end
                if (rgbToHex(c.style.backgroundColor) === winningHex) {
                    c.style.opacity = "1";
                    c.style.border = "4px solid white";
                    c.style.transform = "scale(1.2)";
                } else {
                    c.style.opacity = "0.2";
                }
            });
        }

        function rgbToHex(rgb) {
            let res = rgb.match(/\d+/g).map(x => parseInt(x).toString(16).padStart(2, '0')).join('');
            return `#${res}`.toUpperCase();
        }

        setupGame();
    </script>
</body>
</html>
